name: Vinutha Bakery CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Verify Dockerfiles
        run: |
          pwd
          git rev-parse --short HEAD
          ls -la
          test -f Dockerfile.frontend
          test -f Dockerfile.backend

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build frontend Docker image
        run: docker build -f Dockerfile.frontend -t vinutha-frontend .

      - name: Build backend Docker image
        run: docker build -f Dockerfile.backend -t vinutha-backend .
